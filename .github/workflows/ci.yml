name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Which half of the repository changed. A prose-only change skips every job
  # below, and each reports "skipped" rather than nothing at all — a required
  # check that never reports would block the pull request forever.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.kind.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job runs a script out of the pull request's own checkout; the
          # token has no business sitting in that working tree's git config.
          persist-credentials: false
      # The gate proves itself before it decides anything.
      - run: scripts/changed-kind.sh --self-test
      - id: kind
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: scripts/changed-kind.sh >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # The plugin manifests and server.json repeat Cargo.toml's version.
      - run: scripts/sync-version.sh --check
      # The plugin and its marketplace load in Claude Code.
      - run: npx --yes @anthropic-ai/claude-code plugin validate . && npx --yes @anthropic-ai/claude-code plugin validate plugin && npx --yes @anthropic-ai/claude-code plugin validate plugin-desktop

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - name: Build binary
        run: cargo build -p newera --locked
      # The binary just built, talked to over MCP like an AI client would. It
      # was a job of its own that compiled this same binary again.
      - name: MCP smoke test
        if: runner.os == 'Linux'
        run: scripts/mcp-smoke.sh target/debug/newera

  cloud:
    name: Hosted service (Postgres)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newera
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/newera
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p newera-cloud --locked

  golden:
    name: Review snapshot
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every finding over a fixed corpus, at every Brazilian way of naming a
      # place: too slow unoptimised, so it has its own job and profile.
      - run: cargo test --profile quick -p newera-ergonomics --test golden --locked -- --ignored

  msrv:
    name: MSRV (1.95)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `+1.95` overrides rust-toolchain.toml, which pins `stable`.
      - run: cargo +1.95 check --workspace --locked

  web:
    name: Web viewer and editor (wasm32)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # What is checked here is that the wasm runs, not how small it is: thin LTO
    # with one codegen unit was most of this job's compile time. publish.yml
    # builds with the full release profile and runs these same browser tests
    # before anything reaches the site.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      # The site's own endpoints — the usage count and the crash tunnel. Node
      # is already here and they answer in milliseconds, so they go first.
      - run: node --test scripts/ping.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p newera-web --release --target wasm32-unknown-unknown --locked
      # .clippy-wasm bans the std calls that panic in the tab: Instant::now,
      # SystemTime::now/elapsed, thread::spawn/sleep/scope, process::id and
      # env::temp_dir. Native runs cannot use it: web_time's clocks are std's
      # own there.
      - run: cargo clippy -p newera-app -p newera-editor-web --target wasm32-unknown-unknown --locked -- -D warnings
        env:
          CLIPPY_CONF_DIR: .clippy-wasm
      # Building it proves nothing about it running: this draws a wall with the
      # mouse in a headless Chrome and fails on any error the page logs.
      # A prebuilt wasm-bindgen: compiling it here would cost more than the
      # test it serves.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Build the browser editor
        run: |
          cargo build -p newera-editor-web --release --target wasm32-unknown-unknown --locked
          wasm-bindgen --target web --no-typescript --out-dir web/editor/pkg \
            target/wasm32-unknown-unknown/release/newera_editor_web.wasm
          cp target/wasm32-unknown-unknown/release/newera_web.wasm web/
      - name: Draw a wall in the browser
        run: |
          python3 -m http.server 8790 --bind 127.0.0.1 --directory web &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8790/editor/ >/dev/null && break; sleep 0.25; done
          mkdir -p target/web-e2e
          node scripts/web-editor-e2e.mjs http://127.0.0.1:8790/editor/ target/web-e2e
      # And again without WebGPU: the path a Firefox visitor lands on.
      - name: Draw a wall without WebGPU
        run: NO_WEBGPU=1 node scripts/web-editor-e2e.mjs http://127.0.0.1:8790/editor/ target/web-e2e
      # The browser as an MCP server: the tab switches it on, an AI client
      # talks to the address the relay hands out, and what it draws has to be
      # in that tab's project.
      # What a phone gets: the page must not scroll sideways, nothing may be
      # too small to tap, and no text below what a person can read at arm's
      # length — checked at four real handset sizes.
      - name: The site and the editor on a phone
        run: |
          RUN_CHROME_TESTS=1 node --test scripts/chrome-session.test.mjs
          python3 -m http.server 8801 --bind 127.0.0.1 --directory site &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:8801/ >/dev/null && break; sleep 0.25; done
          node scripts/mobile-audit.mjs http://127.0.0.1:8801/ target/mobile
          node scripts/mobile-audit.mjs http://127.0.0.1:8790/editor/ target/mobile-app
          node scripts/mobile-audit.mjs http://127.0.0.1:8790/ target/mobile-viewer
      - name: An AI draws in the browser over MCP
        run: |
          cargo build -p newera-relay --release --locked
          PORT=7979 ./target/release/newera-relay &
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:7979/health >/dev/null && break; sleep 0.25; done
          node scripts/web-mcp-e2e.mjs http://127.0.0.1:8790/editor/ http://127.0.0.1:7979
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-editor-screenshots
          path: target/web-e2e
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone-screenshots
          path: |
            target/mobile
            target/mobile-app
            target/mobile-viewer
          if-no-files-found: ignore

  deny:
    name: Licenses & advisories
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The one check for branch protection to require, rather than ten that change
  # name whenever a job does. It also covers a trap: when a matrix job is
  # skipped, GitHub reports it once under the job's unexpanded name, so
  # Test (ubuntu-latest) and its siblings never arrive on a prose-only run and
  # a required check waiting on them would block the pull request forever.
  # This job runs either way and speaks for all of them.
  ci:
    name: CI
    needs: [changes, fmt, clippy, test, golden, cloud, msrv, web, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded, or had nothing to do
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job reported '$result'"; exit 1 ;;
            esac
          done
