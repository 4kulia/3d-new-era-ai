name: Docs

# The other half of the Rust CI: prose leaves that workflow and lands here.
# Every Markdown file in the repository is checked, the plugin's skills
# included — those also go through ci.yml, which validates them as plugin
# manifests rather than as prose.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether anything here reads the change at all. Same reason as ci.yml: a
  # skipped job reports a status, a workflow that never starts does not.
  changes:
    name: Changed prose
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.kind.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job runs a script out of the pull request's own checkout; the
          # token has no business sitting in that working tree's git config.
          persist-credentials: false
      # The gate proves itself before it decides anything.
      - run: scripts/changed-kind.sh --self-test
      - id: kind
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: scripts/changed-kind.sh >> "$GITHUB_OUTPUT"

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rules live in .markdownlint-cli2.jsonc, so `make docs` runs the same set.
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0

  spelling:
    name: Spelling
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The documentation, not the code and not the automation. The UI strings
      # in the Rust tree are translated inline, and the deploy workflow is
      # commented in Portuguese; an English dictionary has nothing useful to say
      # about either. README.pt-BR.md is named out rather than excluded in
      # _typos.toml, because a path given on the command line is checked whether
      # it is excluded or not. Add a new root page here.
      - uses: crate-ci/typos@v1.51.1
        with:
          files: "README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs .github/ISSUE_TEMPLATE .github/pull_request_template.md plugin plugin-desktop"

  links:
    name: Links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Offline: a relative link into docs/ that a rename broke is a bug in the
      # repository. A dead link on somebody else's server is not, and checking
      # them on every pull request buys flakes and rate limits.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress "**/*.md"
          fail: true

  # The one check to require here, for the same reason as ci.yml.
  docs:
    name: Docs
    needs: [changes, markdown, spelling, links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded, or had nothing to do
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job reported '$result'"; exit 1 ;;
            esac
          done
