[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leandrodaf/3d-new-era-ai"
homepage = "https://github.com/leandrodaf/3d-new-era-ai"
authors = ["Leandro Ferreira"]
keywords = ["3d", "home-design", "floor-plan", "mcp", "ai"]
categories = ["graphics", "command-line-utilities"]

[workspace.dependencies]
# Internal crates
newera-core = { path = "crates/newera-core", version = "3.1.0" }
newera-mcp = { path = "crates/newera-mcp", version = "3.1.0" }
newera-telemetry = { path = "crates/newera-telemetry", version = "3.1.0" }
newera-server = { path = "crates/newera-server", version = "3.1.0" }
newera-app = { path = "crates/newera-app", version = "3.1.0" }
newera-draw = { path = "crates/newera-draw", version = "3.1.0" }
newera-catalog = { path = "crates/newera-catalog", version = "3.1.0" }
newera-sh3d = { path = "crates/newera-sh3d", version = "3.1.0" }
newera-render = { path = "crates/newera-render", version = "3.1.0" }
newera-plugins = { path = "crates/newera-plugins", version = "3.1.0" }
newera-joinery = { path = "crates/newera-joinery", version = "3.1.0" }
newera-ergonomics = { path = "crates/newera-ergonomics", version = "3.1.0" }

# External crates
ab_glyph = "0.2.32"
anyhow = "1.0.104"
base64 = "0.23.1"
axum = "0.8.9"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = "0.37.0"
epaint_default_fonts = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
glam = { version = "0.33.7", features = ["bytemuck"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rmcp = { version = "3.4.0" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Geometry code reads best with math-style names (p, q, a, b, n).
many_single_char_names = "allow"
similar_names = "allow"
# UI and tool dispatch read top to bottom; splitting them hurts more than it helps.
too_many_lines = "allow"
# The home model mirrors real settings (visibility flags, locks) and
# element variants differ in size by nature; boxing them buys nothing.
struct_excessive_bools = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The build to develop on. What `release` costs is the link — one codegen unit
# and thin LTO over the whole tree — and what `dev` costs is a frontend that
# barely parallelizes: measured on one changed constant in the core, the editor
# comes back in 23 s here against 50 s on `dev` and 5 min 27 s on `release`,
# and it is as fast to use as the one that ships. Debug assertions and overflow
# checks stay on, as in `dev`. Ship `release`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug-assertions = true
overflow-checks = true
strip = "debuginfo"

# Keep debug builds lean: full debug info only for our crates, and optimized
# dependencies so the 3D view and geometry stay fluid while developing.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
