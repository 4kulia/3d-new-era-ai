[package]
name = "newera-core"
description = "Domain model, commands and undo/redo history for 3D New Era AI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
geo = "0.33.1"
image.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only for `collab::now_ms`; the raw wasm viewer (newera-web) leaves it off, since
# web-time imports wasm-bindgen symbols that its loader does not provide.
web-time = { workspace = true, optional = true }
zip.workspace = true

[features]
# `collab::now_ms`: the wall clock that also works in a browser tab.
clock = ["dep:web-time"]

[lints]
workspace = true
