[package]
name = "newera-mcp"
description = "Model Context Protocol server exposing the 3D New Era AI editor to AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
image.workspace = true
newera-catalog.workspace = true
newera-core.workspace = true
newera-sh3d.workspace = true
newera-draw.workspace = true
newera-joinery.workspace = true
newera-ergonomics.workspace = true
newera-plugins.workspace = true
newera-render.workspace = true
newera-telemetry.workspace = true
rmcp = { workspace = true, features = ["server", "macros"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
regex-lite = "0.1.9"
# `Instant` that works in a browser tab (std's panics there); std's own natively.
web-time.workspace = true

# The transports that need an operating system stay off the browser build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
rmcp = { workspace = true, features = ["transport-io", "transport-streamable-http-server"] }

# In a browser the randomness comes from the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
tokio.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum.workspace = true
futures-util.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
