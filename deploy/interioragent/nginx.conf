# Installed as /etc/nginx/sites-available/interioragent.dutch-atlas.com; the
# certificate is Let's Encrypt, issued and renewed by certbot on the host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name interioragent.dutch-atlas.com;

    ssl_certificate /etc/letsencrypt/live/interioragent.dutch-atlas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interioragent.dutch-atlas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 64m;

    # Nothing of the editor opens without signing in: each location that
    # serves editor bytes asks the cloud whether the browser holds a session
    # (auth_request), and a browser without one is sent to sign in and brought
    # back to what it asked for. The two redirects below serve no bytes, so
    # they are made before the question: a redirect to a guarded location
    # shows the person the sign-in page all the same.
    location = /_signed_in {
        internal;
        proxy_pass http://127.0.0.1:7979/login/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location @signin {
        rewrite ^ /login/required? break;
        proxy_pass http://127.0.0.1:7979;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # The editor connects to the service named by ?relay=; without it, to
    # upstream's: this host is named instead.
    location = /app/ {
        if ($arg_relay = "") {
            return 302 /app/?relay=https://$host&$args;
        }
        auth_request /_signed_in;
        error_page 401 = @signin;
        proxy_pass http://127.0.0.1:7978;
        proxy_set_header Host $host;
    }

    # The cloud's own `/` sends visitors to its first site origin, which is
    # this host: open the editor instead.
    location = / {
        return 302 /app/;
    }

    # Files the editor page loads from the site root.
    location ~ ^/(favicon\.svg|demo\.newera)$ {
        auth_request /_signed_in;
        error_page 401 = @signin;
        proxy_pass http://127.0.0.1:7978;
        proxy_set_header Host $host;
    }

    location /app/ {
        auth_request /_signed_in;
        error_page 401 = @signin;
        proxy_pass http://127.0.0.1:7978;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:7979;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name interioragent.dutch-atlas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
