<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>3D New Era AI — Editor</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PLY5GQC6EP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PLY5GQC6EP');
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; }
  /* The page is a column: whatever has something to say takes its own row and
     the editor takes the rest. A note that floats over the canvas covers the
     app's own menus, which on a phone is most of what there is. */
  body { display: flex; flex-direction: column; }
  /* The editor handles its own gestures: a finger drags the plan, a pinch
     zooms it, a wheel zooms. Saying so here is what stops the browser from
     also scrolling the page — and stops the console filling with
     "Unable to preventDefault inside passive event listener", which is Chrome
     saying it made the listener passive because nobody claimed the gesture. */
  #newera { flex: 1 1 auto; width: 100%; min-height: 0; display: block;
    touch-action: none; overscroll-behavior: none; }
  html, body { overscroll-behavior: none; touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9aa1ad; font: 15px system-ui, sans-serif; pointer-events: none; }
  #failed { position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    color: #e6e8ec; font: 16px/1.5 system-ui, sans-serif; background: #16181d; }
  #failed a { color: #9fb0ff; }
  #failed small { color: #6f7581; font-size: 12px; max-width: 60ch; word-break: break-word; }
  #notice { flex: 0 0 auto; display: none; gap: 12px;
    align-items: center; justify-content: center; padding: 8px 14px;
    background: #2a2417; color: #e8b165; border-bottom: 1px solid #3d3a33;
    font: 13px/1.4 system-ui, sans-serif; }
  #notice button { border: 0; background: none; color: inherit; cursor: pointer; font: inherit;
    min-width: 44px; min-height: 44px; padding: 0 4px; opacity: 0.7; }
  #notice button:hover { opacity: 1; }
</style>
</head>
<body>
<canvas id="newera"></canvas>
<script>
  // Last messages, for diagnosing the page from automation.
  window.neweraLog = [];
  for (const level of ["error", "warn"]) {
    const original = console[level];
    console[level] = (...args) => { window.neweraLog.push(level + ": " + args.join(" ")); original(...args); };
  }
  addEventListener("error", (e) => window.neweraLog.push("uncaught: " + e.message));
  addEventListener("unhandledrejection", (e) => window.neweraLog.push("rejection: " + e.reason));
</script>
<div id="loading">Carregando o editor…</div>
<div id="notice" role="status">
  <span id="notice-text"></span>
  <button type="button" id="notice-close" aria-label="Fechar">✕</button>
</div>
<div id="failed" role="alert">
  <p id="failed-text">Este navegador não conseguiu iniciar o editor 3D.</p>
  <p><a href="/#baixar" id="failed-link">Baixe o aplicativo para o seu computador</a></p>
  <small id="failed-why"></small>
</div>
<script>
  // The window itself speaks four languages; so do the lines around it.
  const WORDS = {
    pt: { webgl: "Sem WebGPU: o editor está rodando em WebGL. Funciona, mas o suporte oficial é no Chrome e no Edge — no Firefox não garantimos.", linux: "O Chrome no Linux vem com a placa de vídeo desativada para o WebGPU, então o editor está rodando em WebGL (mais lento). Para ativar: 1) copie chrome://flags/#enable-unsafe-webgpu e cole na barra de endereço; 2) mude para Enabled; 3) faça o mesmo com chrome://flags/#enable-vulkan; 4) clique em Relaunch para reiniciar o Chrome.", blocked: "O navegador tem WebGPU, mas recusou a placa de vídeo (driver bloqueado ou aceleração desligada), então o editor está rodando em WebGL. Funciona; veja o motivo em chrome://gpu." },
    en: { wait: "Loading the editor…", failed: "This browser could not start the 3D editor. Chrome, Edge and Safari 26 run it; an old browser or a blocked GPU cannot.", download: "Download the app for your computer", webgl: "No WebGPU here: the editor is running on WebGL. It works, but Chrome and Edge are the supported browsers — Firefox is not guaranteed.", linux: "Chrome on Linux ships with the graphics card turned off for WebGPU, so the editor is running on WebGL (slower). To turn it on: 1) copy chrome://flags/#enable-unsafe-webgpu into the address bar; 2) set it to Enabled; 3) do the same with chrome://flags/#enable-vulkan; 4) click Relaunch to restart Chrome.", blocked: "This browser has WebGPU but refused the graphics card (a blocked driver or hardware acceleration turned off), so the editor is running on WebGL. It works; chrome://gpu shows why." },
    es: { wait: "Cargando el editor…", failed: "Este navegador no pudo iniciar el editor 3D. Chrome, Edge y Safari 26 lo ejecutan; un navegador antiguo o una GPU bloqueada no.", download: "Descargue la aplicación para su ordenador", webgl: "Sin WebGPU: el editor está funcionando en WebGL. Funciona, pero el soporte oficial es Chrome y Edge — en Firefox no lo garantizamos.", linux: "Chrome en Linux trae la tarjeta gráfica desactivada para WebGPU, así que el editor está funcionando en WebGL (más lento). Para activarla: 1) copie chrome://flags/#enable-unsafe-webgpu en la barra de direcciones; 2) cámbielo a Enabled; 3) haga lo mismo con chrome://flags/#enable-vulkan; 4) pulse Relaunch para reiniciar Chrome.", blocked: "El navegador tiene WebGPU, pero rechazó la tarjeta gráfica (controlador bloqueado o aceleración desactivada), así que el editor está funcionando en WebGL. Funciona; el motivo aparece en chrome://gpu." },
    fr: { wait: "Chargement de l'éditeur…", failed: "Ce navigateur n'a pas pu démarrer l'éditeur 3D. Chrome, Edge et Safari 26 le font tourner ; un navigateur ancien ou un GPU bloqué, non.", download: "Téléchargez l'application pour votre ordinateur", webgl: "Pas de WebGPU : l'éditeur tourne en WebGL. Cela fonctionne, mais les navigateurs pris en charge sont Chrome et Edge — Firefox n'est pas garanti.", linux: "Chrome sous Linux est livré avec la carte graphique désactivée pour WebGPU, donc l'éditeur tourne en WebGL (plus lent). Pour l'activer : 1) copiez chrome://flags/#enable-unsafe-webgpu dans la barre d'adresse ; 2) passez-le sur Enabled ; 3) faites de même avec chrome://flags/#enable-vulkan ; 4) cliquez sur Relaunch pour redémarrer Chrome.", blocked: "Le navigateur a WebGPU mais a refusé la carte graphique (pilote bloqué ou accélération désactivée), donc l'éditeur tourne en WebGL. Cela fonctionne ; chrome://gpu indique pourquoi." },
  };
  const tag = (navigator.languages ?? [navigator.language ?? ""])
    .map((name) => String(name).slice(0, 2).toLowerCase())
    .find((name) => name === "pt" || name in WORDS) ?? "en";
  const words = WORDS[tag] ?? WORDS.en;
  if (tag !== "pt") {
    document.documentElement.lang = tag;
    document.getElementById("loading").textContent = words.wait;
    document.getElementById("failed-text").textContent = words.failed;
    document.getElementById("failed-link").textContent = words.download;
  }

  // Without WebGPU the editor falls back to WebGL: it draws everything, but
  // it is not the browser this is supported on. Say so once, dismissible.
  (async () => {
    let webgpu = false;
    try {
      webgpu = Boolean(navigator.gpu && (await navigator.gpu.requestAdapter()));
    } catch (_) { /* the API is there but refuses: same as not having it */ }
    if (webgpu) return;
    // "Use Chrome" is no advice to someone already in Chrome: name the cause.
    // Chrome on Linux ships WebGPU off, and a present API with no adapter is
    // a GPU the browser turned down — neither is fixed by switching browsers.
    const chromium = (navigator.userAgentData?.brands ?? []).some((b) => b.brand === "Chromium")
      || /Chrome\//.test(navigator.userAgent);
    const linux = /Linux/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent);
    const reason = navigator.gpu ? (chromium ? "blocked" : "webgl")
      : chromium && linux ? "linux" : "webgl";
    // Remembered per reason: dismissing the old generic line must not hide the how-to.
    const seen = reason === "webgl" ? "seen" : "seen-" + reason;
    try { if (localStorage.getItem("newera-webgl-notice") === seen) return; } catch (_) { /* private mode */ }
    const notice = document.getElementById("notice");
    document.getElementById("notice-text").textContent = words[reason];
    notice.style.display = "flex";
    // It sits over the editor's own top bar — which on a phone is most of the
    // screen — so it says its piece and goes, and stays gone once read. Steps to
    // follow stay until closed: nobody copies a flag in twelve seconds.
    const hide = (remember) => {
      notice.style.display = "none";
      if (!remember) return;
      try { localStorage.setItem("newera-webgl-notice", seen); } catch (_) { /* private mode */ }
    };
    if (reason === "webgl") setTimeout(() => hide(false), 12000);
    document.getElementById("notice-close").addEventListener("click", () => hide(true));
  })();

  // A blank page tells nobody anything: whatever kills the engine — no WebGPU,
  // a driver that gives up, a panic — is shown, with the way out.
  let engineFailed = false;
  window.neweraReady = false;
  const activeCalls = new Map();
  let sequence = 0;
  // Only operation names and revisions: never retain arguments, room keys or URLs.
  window.neweraOperation = (event, token, name, revision) => {
    if (event === "begin") {
      const id = ++sequence;
      activeCalls.set(id, {tool: String(name).slice(0, 80), revision: String(revision)});
      return id;
    }
    activeCalls.delete(token);
  };
  // Own the emergency path in JavaScript: these listeners survive a Rust/WASM trap.
  const diagnosticSockets = new Set();
  window.neweraAttachSocket = (socket) => {
    const pending = new Map();
    const send = socket.send.bind(socket);
    const entry = {pending, fail(id) {
      if (socket.readyState !== 1) return;
      try {
        send(JSON.stringify({type:'result', id, ok:true, result:{isError:true,
          content:[{type:'text', text:JSON.stringify({kind:'editor_runtime_failure',
            diagnostic:window.neweraDiagnostic, action:'Reload the editor to restore its last confirmed snapshot.'})}]}}));
      } catch (_) { /* A closing socket is handled as disconnected by the relay. */ }
    }};
    diagnosticSockets.add(entry);
    socket.addEventListener('message', event => {
      let message;
      try { message = JSON.parse(event.data); } catch (_) { return; }
      if (message?.type !== 'call') return;
      if (engineFailed) {
        event.stopImmediatePropagation();
        entry.fail(message.id);
        return;
      }
      pending.set(JSON.stringify(message.id), {id:message.id, tool:String(message.name).slice(0,80)});
    }, true);
    socket.send = function(data) {
      let message;
      try { message = JSON.parse(data); } catch (_) { /* Non-JSON transport message. */ }
      if (message?.type === 'result') {
        pending.delete(JSON.stringify(message.id));
        if (engineFailed) return; // The emergency path already answered this call.
      }
      return send(data);
    };
    socket.addEventListener('close', () => { pending.clear(); diagnosticSockets.delete(entry); });
  };
  const runtimeWords = {
    pt: "O editor encontrou uma falha durante o uso.",
    en: "The editor encountered an error while running.",
    es: "El editor encontró un error durante el uso.",
    fr: "L’éditeur a rencontré une erreur en cours d’utilisation.",
  };
  const safeCause = (why) => String(why ?? "")
    .replace(/(?:https?|wss?):\/\/[^\s)]+/gi, "[URL]")
    .replace(/Bearer\s+[^\s,;]+/gi, "Bearer [redacted]")
    .replace(/"(?:token|tab_key|client_token|authorization|password)"\s*:\s*"[^"]*"/gi, '"credential":"[redacted]"')
    .replace(/((?:token|tab_key|client_token|authorization|password)\s*[=:]\s*)[^\s,;]+/gi, "$1[redacted]")
    .slice(0, 600);
  // The note about WebGL sits over the app's own top bar, which on a phone is
  // most of it: it says its piece and leaves.
  window.neweraNoticeTimer = null;
  window.neweraFail = (why) => {
    if (engineFailed) return;
    engineFailed = true;
    window.neweraDiagnostic = {
      phase: window.neweraReady ? "runtime" : "startup",
      build: document.body.getAttribute("data-render-build"),
      backend: document.body.getAttribute("data-editor-backend") ?? "unknown",
      operations: activeCalls.size ? [...activeCalls.values()]
        : [...diagnosticSockets].flatMap(s => [...s.pending.values()].map(p => ({tool:p.tool, revision:null}))),
      recovery: window.neweraRecovery ? {
        state:window.neweraRecovery.state,
        saved_revision:window.neweraRecovery.saved_revision ?? null,
        saved_at:window.neweraRecovery.saved_at ?? null,
        restored_from_revision:window.neweraRecovery.restored_from_revision ?? null,
      } : null,
      cause: safeCause(why),
      panic: /unreachable/i.test(String(why))
        ? safeCause((window.neweraLog ?? []).findLast(line => /panicked at|no filesystem on this platform/i.test(line)) ?? "")
        : "",
    };
    for (const socket of diagnosticSockets) {
      for (const {id} of socket.pending.values()) socket.fail(id);
      socket.pending.clear();
    }
    if (window.neweraReady) document.getElementById("failed-text").textContent = runtimeWords[tag];
    document.getElementById("loading")?.remove();
    const panel = document.getElementById("failed");
    panel.style.display = "flex";
    document.getElementById("failed-why").textContent = JSON.stringify(window.neweraDiagnostic);
  };
  addEventListener("error", (e) => {
    if (/unreachable|wasm|webgpu|adapter|createBuffer/i.test(e.message ?? "")) neweraFail(e.message);
  });
  addEventListener("unhandledrejection", (e) => neweraFail(e.reason));
</script>
<script type="module">
  // The glue and the wasm are halves of one build and have fixed names, so a
  // browser holding yesterday's glue and today's wasm links them together and
  // refuses: "function import requires a callable". Both URLs carry the same
  // stamp — written in at publish time, one per build — so a cache can only
  // ever serve a matching pair.
  // Substituted at publish time. Served straight from the repository it keeps
  // its placeholder, and then every load asks for a fresh pair — which is what
  // you want while building the thing.
  const STAMP = "__BUILD__";
  const BUILD = STAMP.startsWith("__") ? String(Date.now()) : STAMP;
  const boot = async (again) => {
    const v = again ? `${BUILD}-${Math.random().toString(36).slice(2)}` : BUILD;
    document.body.setAttribute("data-render-build", v);
    const glue = await import(`./pkg/newera_editor_web.js?v=${v}`);
    await glue.default({ module_or_path: `./pkg/newera_editor_web_bg.wasm?v=${v}` });
    return glue;
  };

  const loading = document.getElementById("loading");
  // ?project=URL opens a project; without it the demo home is shown.
  // A project kept in the cloud comes from the account's service, with the
  // person's cookie; anything else is fetched as a plain file.
  const params = new URLSearchParams(location.search);
  const url = params.get("project") ?? "../demo.newera";
  const service = params.get("relay") ?? "https://mcp.3dneweraai.com";
  // Its revision comes with it: the tab saves it back on that revision.
  let name = null, bytes = null, revision = null;
  try {
    const own = url.startsWith(service + "/account/projects/");
    const response = await fetch(url, { credentials: own ? "include" : "same-origin" });
    if (response.ok) {
      bytes = new Uint8Array(await response.arrayBuffer());
      // The name as written (RFC 5987 filename*) first, then the ASCII one.
      const disposition = response.headers.get("content-disposition") ?? "";
      const written = /filename\*=UTF-8''([^;]+)/i.exec(disposition);
      const saved = /filename="([^"]+)"/.exec(disposition);
      try { name = written ? decodeURIComponent(written[1].trim()) : null; } catch (_) { name = null; }
      name ??= saved ? saved[1] : decodeURIComponent(url.split("/").pop());
      if (own) revision = response.headers.get("x-project-revision");
    }
  } catch (_) { /* start empty */ }
  try {
    let glue;
    try {
      glue = await boot(false);
    } catch (error) {
      // A mismatched pair got through anyway (a half-updated CDN, a service
      // worker, a proxy): ask for both again, past every cache, once.
      if (!/LinkError|callable|import|magic|Wasm/i.test(String(error))) throw error;
      glue = await boot(true);
    }
    loading.remove();
    await glue.start("newera", name, bytes, params.has("project"), revision);
    window.neweraReady = true;
  } catch (error) {
    window.neweraFail(error);
  }
</script>
</body>
</html>
